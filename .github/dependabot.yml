# Version drift is the network's chronic disease — satellites were still
# running a 2.0-era artifact the day 2.3.4 shipped, and nothing about a stale
# host looks broken from the outside. This is the standing fix.
#
# TEMPLATE FILE: satellites copy this verbatim. The `dash-network` group is
# the point — a package release lands as ONE reviewable pull request per repo
# instead of five, which is the difference between a rollout and a chore.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Version-update PRs are restricted to the network packages — the drift
    # alarm this file exists for. Without this allow-list, dependabot also
    # proposes FLOOR-RAISES for every other requirement (gunicorn >=23 →
    # >=26, pandas >=1.2.3 → >=3, ...). Those floors encode
    # minimum-compatibility knowledge (the gunicorn floor IS the CVE fact),
    # the resolver already installs latest under them, and a raise erases
    # the floor's meaning while adding none — llms-2plot-dev's fork opened
    # five such PRs on its first push, all closed with reasons
    # (2026-08-23). SECURITY updates are unaffected: they arrive through
    # GitHub's separate security-update channel regardless of this list.
    allow:
      - dependency-name: "dash*"
      - dependency-name: "plotly*"
      - dependency-name: "markdown2dash"
    groups:
      dash-network:
        patterns:
          - "dash*"
          - "plotly*"
          - "markdown2dash"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
